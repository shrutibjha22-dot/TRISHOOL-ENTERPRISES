# Render.com blueprint - deploy the whole site with one click.
#
#   1. Push this repository to GitHub   (done)
#   2. Go to https://render.com and sign in
#   3. New  ->  Blueprint  ->  choose TRISHOOL-ENTERPRISES
#   4. Render reads this file and creates BOTH the web service and the
#      MySQL database, already wired together
#   5. Fill in the two values Render asks for:
#        ADMIN_SEED_EMAIL      your own email address
#        ADMIN_SEED_PASSWORD   a strong password you choose
#
# Why this exists at all: GitHub Pages only serves static files, so it cannot
# run this backend. Once deployed here, one address serves the website, the
# forms that save to the database, and the admin dashboard - because
# server/index.js serves the page and the API from the same origin. No settings
# in the frontend need changing.
#
# SEE DEPLOYMENT.md for the full walkthrough and the free-tier limits.

services:
  - type: web
    name: trishool-website
    runtime: node
    plan: free
    # Nothing to compile - plain HTML, CSS and JavaScript. Just install.
    buildCommand: npm ci --omit=dev
    # A fresh Render database has no tables in it, so create them and load the
    # services and the admin account before the server starts serving.
    # Both steps are safe to re-run, which also self-heals a replaced database.
    startCommand: npm run db:setup && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render must listen on every interface, not just localhost.
      - key: HOST
        value: "0.0.0.0"
      # --- database, filled in automatically from the instance below ---
      - key: DB_HOST
        fromDatabase:
          name: trishool-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: trishool-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: trishool-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trishool-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: trishool-db
          property: database
      # --- security ---
      # The site is served over HTTPS, so the session cookie must be marked
      # secure or the browser will refuse to send it back.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # --- the admin account. Render prompts for both. ---
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        value: Trishool Admin
      # --- business details shown on the public site ---
      - key: BUSINESS_NAME
        value: TRISHOOL ENTERPRISES
      - key: BUSINESS_WHATSAPP
        value: "919082278478"
      - key: BUSINESS_UPI_ID
        value: "9324534405@ptaxis"
      - key: GST_RATE
        value: "18"

databases:
  - name: trishool-db
  # FREE TIER WARNING: Render deletes a free MySQL instance after 30 days.
  # Buy the paid plan before that, or the orders, enquiries, bookings and
  # reviews in it are lost. See DEPLOYMENT.md.
    plan: free
    databaseName: trishool_db
    user: trishool