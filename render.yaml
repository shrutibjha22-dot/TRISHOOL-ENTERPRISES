# Render.com blueprint - deploy the whole site with one click.
#
#   1. Push this repository to GitHub   (done)
#   2. Go to https://render.com and sign in
#   3. New  ->  Blueprint  ->  choose TRISHOOL-ENTERPRISES
#   4. Render reads this file and creates BOTH the web service and the
#      MySQL database, already wired together
#   5. Fill in the two values Render asks for:
#        ADMIN_SEED_EMAIL      your own email address
#        ADMIN_SEED_PASSWORD   a strong password you choose
#
# Why this exists at all: GitHub Pages only serves static files, so it cannot
# run this backend. Once deployed here, one address serves the website, the
# forms that save to the database, and the admin dashboard - because
# server/index.js serves the page and the API from the same origin. No settings
# in the frontend need changing.
#
# SEE DEPLOYMENT.md for the full walkthrough and the free-tier limits.

services:
  - type: web
    name: trishool-website
    runtime: node
    plan: free
    # Nothing to compile - plain HTML, CSS and JavaScript. Just install.
    buildCommand: npm ci --omit=dev
    # A fresh Render database has no tables in it, so create them and load the
    # services and the admin account before the server starts serving.
    # Both steps are safe to re-run, which also self-heals a replaced database.
    startCommand: npm run db:setup && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render must listen on every interface, not just localhost.
      - key: HOST
        value: "0.0.0.0"
      # --- database ---
      # These are prompted for, not created here. Render used to offer a
      # free MySQL instance, but it no longer does: its only databases are
      # Postgres and Redis. A blueprint that asked it for MySQL would fail to
      # apply, so the database is created separately and these five values are
      # pasted in.
      #
      # TiDB Cloud's free Starter tier is the recommended host: it speaks the
      # MySQL protocol, so this application runs on it unchanged, needs no
      # credit card, and comes with 5 GiB. See DEPLOYMENT.md for the exact
      # steps and which value goes where.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Hosted MySQL-compatible databases require an encrypted connection.
      # The local MariaDB has no certificate, which is why this is off by
      # default in .env and only switched on here.
      - key: DB_SSL
        value: "true"
      # --- security ---
      # The site is served over HTTPS, so the session cookie must be marked
      # secure or the browser will refuse to send it back.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Render forwards every request through its own proxy, so without this
      # Express cannot tell the visitors apart. The rate limiter counts per IP,
      # so all customers would share ONE bucket of 60 form submissions an hour
      # and everyone would be locked out together once it ran out.
      #
      # 1 means "trust exactly one hop", which is correct here: Render appends
      # the real visitor's address to X-Forwarded-For. It is not left on by
      # default, because trusting the whole header would let anyone forge their
      # address and bypass the limiter.
      - key: TRUST_PROXY
        value: "1"
      # The published website runs on GitHub Pages while the API runs here,
      # so every call it makes is cross-origin. Without this the browser
      # blocks the responses and no form and no admin sign-in can work from
      # that address - the same-origin Render URL would still be fine, which
      # makes it easy to miss.
      #
      # This is also what turns the session cookie from SameSite=Lax to
      # SameSite=None, without which a cross-origin sign-in would succeed and
      # then be refused on every following request.
      #
      # Change this if the site is ever published somewhere else.
      - key: PUBLIC_ORIGIN
        value: "https://shrutibjha22-dot.github.io"
      # --- the admin account. Render prompts for both. ---
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        value: Trishool Admin
      # --- business details shown on the public site ---
      - key: BUSINESS_NAME
        value: TRISHOOL ENTERPRISES
      - key: BUSINESS_WHATSAPP
        value: "919082278478"
      - key: BUSINESS_UPI_ID
        value: "9324534405@ptaxis"
      - key: GST_RATE
        value: "18"

# There is deliberately no `databases:` section.
#
# Render does not offer MySQL any more - only Postgres and Redis - so asking it
# to create one would make this blueprint fail to apply rather than deploy. The
# database lives on TiDB Cloud's free Starter tier, which speaks the MySQL
# protocol, and its details are entered when the blueprint prompts for them.
# See DEPLOYMENT.md.